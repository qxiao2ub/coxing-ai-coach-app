# No secret is required for local audio transcription or local rule-based feedback.
#
# To make the cumulative visitor counter persist across Streamlit container restarts
# without a database, configure a fine-grained GitHub token with Contents: Read and
# write permission for ONLY the qxiao2ub/coxing-ai-coach-app repository.
# The app writes the count to a separate `usage-data` branch so normal visits do not
# modify `main` or trigger an app redeploy.

[github_counter]
token = "github_pat_your_fine_grained_token_here"
repo = "qxiao2ub/coxing-ai-coach-app"
path = "data/visitor_count.json"
branch = "usage-data"
source_branch = "main"

# Optional: only needed if you later want LLM-written narrative feedback.
[openai]
api_key = "sk-your-optional-key-here"
